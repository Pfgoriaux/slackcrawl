name: CI
# CI runs on the self-hosted runner (ci-runner, arm64): GitHub-hosted minutes are not used.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: [self-hosted, docker]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: Build
        run: bun build --compile --outfile=slackcrawl-ci src/index.ts
